name: advanced-docker-compose

services:
  web:
    build:
      context: ./app
    container_name: advanced-web
    restart: unless-stopped
    environment:
      APP_NAME: "NEXUS | Cloud Operations"
      STUDENT_NAME: "${STUDENT_NAME:-Leni Tri Agustin}"
      STUDENT_NPM: "${STUDENT_NPM:-2024606601020}"
      DATABASE_URL: "postgresql://${DB_USER:-nexus_user}:${DB_PASSWORD:-ganti_password_db}@db:5432/${DB_NAME:-nexus_db}"
      REDIS_URL: "redis://redis:6379/0"
      CACHE_TTL: "${CACHE_TTL:-30}"
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: advanced-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:-nexus_db}"
      POSTGRES_USER: "${DB_USER:-nexus_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-ganti_password_db}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: advanced-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: advanced-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  frontend:
    name: advanced_frontend
    driver: bridge
  backend:
    name: advanced_backend
    driver: bridge
    internal: true

volumes:
  postgres_data:
    name: advanced_postgres_data
  redis_data:
    name: advanced_redis_data
